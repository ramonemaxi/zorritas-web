<!-- BAR CHART -->
<div class="card card-warning">
    <div class="card-header">
      <h3 class="card-title">Comparacion {{año_actual }} / {{año_anterior }}</h3>

      <div class="card-tools">
        <button type="button" class="btn btn-tool" data-card-widget="collapse">
          <i class="fas fa-minus"></i>
        </button>
        <button type="button" class="btn btn-tool" data-card-widget="remove">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="chart">
        <canvas id="barChart" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
      </div>
    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
  {% block extra_scripts %}
  <script>
    $(document).ready(function () {
      var barChartCanvas = $('#barChart').get(0).getContext('2d');
  
      var barChartData = {
        labels: {{ label_mes|safe }},
        datasets: [
          {
            label: 'Ventas {{ año_actual }}',
            backgroundColor: '#3c8dbc',
            borderColor: '#3c8dbc',
            data: {{ data_mes|safe }}
          },
          {
            label: 'Ventas {{ año_anterior }}',
            backgroundColor: '#f1c40f',
            borderColor: '#f1c40f',
            data: {{ data_mes_anio_pasado|safe }}
          },
          {
            label: 'Ventas {{ dos_años }}',
            backgroundColor: '#000000',
            borderColor: '#000000',
            data: {{ data_mes_2_años|safe }}
          }
        ]
      };
  
      var barChartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        datasetFill: true,
        scales: {
    yAxes: [{
      ticks: {
        stepSize: 1,
        beginAtZero: true,
        suggestedMin: 0,
        suggestedMax: 4  // o el valor máximo que esperás mostrar
      }
    }]
  }
        
      };
  
      new Chart(barChartCanvas, {
        type: 'bar',
        data: barChartData,
        options: barChartOptions
      });
    });
  </script>
  {% endblock %}
